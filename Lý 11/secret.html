
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SECRET</title>
    <link rel="icon" type="image/png" href="Mèo.png">
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at center, #10364b, #06111f 65%);
            color: #eafaff;
            text-align: center;
        }

        .secret-box {
            width: min(90%, 600px);
            padding: 45px 25px;
            border: 1px solid rgba(80, 230, 255, .3);
            border-radius: 25px;
            background: rgba(255,255,255,.06);
            backdrop-filter: blur(25px);
            box-shadow: 0 0 60px rgba(0,220,255,.12);
            animation: appear .8s ease;
        }

        .secret-box h1 {
            color: #48eaff;
            font-size: 32px;
        }

        .secret-box p {
            color: #b6cadb;
            line-height: 1.8;
        }

        .secret-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
        }

        .secret-button {
            width: 58px;
            height: 54px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            border: 1px solid #48eaff;
            border-radius: 13px;
            background: #48eaff;
            color: #061321;
            cursor: pointer;
            text-decoration: none;
            transition: .3s;
        }

        .secret-button:hover {
            background: transparent;
            color: #48eaff;
            transform: translateY(-3px);
        }

        .secret-button svg {
            width: 25px;
            height: 25px;
        }

        .group-icon {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .facebook-icon {
            fill: currentColor;
        }

        .home-button {
            display: inline-block;
            margin-top: 15px;
            padding: 15px 22px;
            border-radius: 12px;
            background: #48eaff;
            color: #06111f;
            text-decoration: none;
            font-weight: bold;
            transition: .3s;
        }

        .home-button:hover {
            transform: translateY(-3px);
            background: transparent;
            color: #48eaff;
        }

        .members-panel {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(72,234,255,.08);
            color: #b6cadb;
        }

        .members-panel.show {
            display: block;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 480px) {
            .secret-box h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="secret-box">

        <p>✦ QUYỀN TRUY CẬP MẬT ✦</p>

        <h1>PHÒNG THÍ NGHIỆM BÍ MẬT</h1>

        <p>Cảm ơn mọi người vì đã xem.</p>
        <p>Mọi người đã khám phá ra một điều bí ẩn...</p>

        <div class="secret-actions">
            <!-- Nút danh sách nhóm -->
<a href="thanh-vien.html"
   class="secret-button"
   title="Danh sách nhóm"
   aria-label="Danh sách nhóm">

    <svg class="group-icon" viewBox="0 0 24 24">
        <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="10" cy="7" r="4"/>
        <path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>

</a>

<!-- Nút Facebook -->
<a href="https://www.facebook.com/VoNguyenNhatHoangRutokufk"
   target="_blank"
   rel="noopener noreferrer"
   class="secret-button"
   title="Facebook"
   aria-label="Facebook">

    <svg class="facebook-icon" viewBox="0 0 24 24">
        <path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.6V3.9c-.8-.1-1.6-.2-2.4-.2-2.4 0-4.1 1.5-4.1 4.2V10H7.5v3h2.7v8z"/>
    </svg>

</a>

</div>

        <!-- Khu vực hiển thị thành viên -->
        <div class="members-panel" id="membersPanel">
            <p>Danh sách thành viên nhóm</p>
            <!-- Thêm tên thành viên vào đây -->
        </div>

        <a href="index.html" class="home-button">
            Quay về trang chủ
        </a>

    </main>

    <script>
        const showMembers = document.getElementById("showMembers");
        const membersPanel = document.getElementById("membersPanel");

        showMembers.addEventListener("click", () => {
            membersPanel.classList.toggle("show");
        });
    </script>

</body>
</html>
